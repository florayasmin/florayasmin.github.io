<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>footprint · flora yasmin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌺</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css?v=gallery5">

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

</head>
<body class="footprint-body">

<header class="site-header">
    <nav class="nav" aria-label="Primary">
        <a href="index.html" class="nav-link">about</a>
        <a href="index.html#experience" class="nav-link">experience</a>
        <a href="footprint.html" class="nav-link active">footprint</a>
        <a href="blog.html" class="nav-link">blog</a>
    </nav>
</header>

<main class="footprint-page">
    <p class="footprint-instruction">A peek into the world I've experienced so far :)</p>
    <p class="footprint-sub">Click a highlighted country to receive a little snippet from that place.</p>

    <div class="map-wrap" id="mapWrap">
        <svg id="worldMap" role="img" aria-label="World map of places Flora has visited"></svg>
        <div class="map-tooltip" id="mapTooltip" hidden></div>
    </div>

    <p class="footprint-mobile-note">Whoops! This page is experienced better on desktop, please switch your device :)</p>
</main>

<footer class="site-footer">
    <button type="button" class="theme-toggle">Switch to dark mode</button>
    <span class="footer-sep">·</span>
    <span>Updated: September 2026</span>
</footer>

<div class="place-modal" id="placeModal" hidden>
    <div class="place-modal-backdrop" id="placeModalBackdrop"></div>
    <div class="place-modal-card" role="dialog" aria-modal="true" aria-labelledby="placeModalTitle">
        <div class="place-modal-header">
            <h2 class="place-modal-heading" id="placeModalTitle">
                <span class="place-modal-name" id="placeModalName"></span>
                <span class="place-modal-tagline" id="placeModalTagline" hidden></span>
            </h2>
            <button class="place-modal-close" id="placeModalClose" type="button" aria-label="Close">✕</button>
        </div>
        <p class="place-modal-story" id="placeModalStory"></p>
        <div class="place-modal-photos" id="placeModalPhotos"></div>
    </div>
</div>

<script>
    /* ISO 3166-1 numeric IDs used by world-atlas */
    const countries = {
        "028": {
            name: "Antigua and Barbuda",
            story: "TBD — story from Antigua and Barbuda goes here.",
            photos: []
        },
        "050": {
            name: "Bangladesh",
            story: "TBD — story from Bangladesh goes here.",
            photos: []
        },
        "380": {
            name: "Italy",
            story: "",
            photos: []
        },
        "682": {
            name: "Saudi Arabia",
            story: "TBD — story from Saudi Arabia goes here.",
            photos: []
        },
        "826": {
            name: "England",
            story: "TBD — story from England goes here.",
            photos: []
        },
        "784": {
            name: "United Arab Emirates",
            story: "TBD — story from the UAE goes here.",
            photos: []
        },
        "792": {
            name: "Turkey",
            story: "TBD — story from Turkey goes here.",
            photos: []
        },
        "756": {
            name: "Switzerland",
            story: "TBD — story from Switzerland goes here.",
            photos: []
        },
        "840": {
            name: "United States",
            story: "TBD — story from the United States goes here.",
            photos: []
        },
        "124": {
            name: "Canada",
            story: "TBD — story from Canada goes here.",
            photos: []
        }
    };

    /* City / place markers — hover shows label; special: true enables click stories */
    const markers = [
        { place: "Antigua and Barbuda", country: "Antigua and Barbuda", coords: [-61.7969, 17.0608] },
        { place: "Dhaka", country: "Bangladesh", coords: [90.3563, 23.6850] },
        { place: "Italy", country: "Italy", coords: [12.5674, 41.8719], special: true, gallery: true, story: "", tagline: "visited some family, and saw some of the greatest artistic talent to ever exist.", photos: [
            "photos/italy/01-milan-duomo.jpg",
            "photos/italy/02-pantheon.jpg",
            "photos/italy/03-david.jpg",
            "photos/italy/04-gelato.jpg",
            "photos/italy/05-pisa.jpg",
            "photos/italy/06-birth-of-venus.jpg",
            "photos/italy/07-ponte-vecchio.jpg",
            "photos/italy/08-trevi.jpg",
            "photos/italy/09-saint-teresa.jpg",
            { src: "photos/italy/10-florence-facade.jpg", position: "center 78%" },
            "photos/italy/11-colosseum.jpg",
            { src: "photos/italy/12-florence-dome.jpg", position: "center 82%" }
        ] },
        { place: "Saudi Arabia", country: "Saudi Arabia", coords: [45.0792, 23.8859] },
        { place: "London", country: "England", coords: [-0.1276, 51.5074] },
        { place: "Dubai", country: "United Arab Emirates", coords: [55.2708, 25.2048] },
        { place: "Istanbul", country: "Turkey", coords: [28.9784, 41.0082] },
        { place: "Switzerland", country: "Switzerland", coords: [8.2275, 46.8182] },
        { place: "Spokane", country: "Washington", coords: [-117.4260, 47.6588] },
        { place: "Portland", country: "Oregon", coords: [-122.6765, 45.5152] },
        { place: "Bay Area", country: "California", coords: [-122.4194, 37.7749] },
        { place: "Los Angeles", country: "California", coords: [-118.2437, 34.0522] },
        { place: "Orlando", country: "Florida", coords: [-81.3792, 28.5383] },
        { place: "Miami", country: "Florida", coords: [-80.1918, 25.7617] },
        { place: "Houston", country: "Texas", coords: [-95.3698, 29.7604] },
        { place: "Atlanta", country: "Georgia", coords: [-84.3880, 33.7490] },
        { place: "Pittsburgh", country: "Pennsylvania", coords: [-79.9959, 40.4406] },
        { place: "Boston", country: "Massachusetts", coords: [-71.0589, 42.3601] },
        { place: "Vancouver", country: "Canada", coords: [-123.1207, 49.2827] }
    ];

    const visitedIds = new Set(Object.keys(countries));

    function markerLabel(m) {
        return m.place === m.country ? m.country : `${m.place}, ${m.country}`;
    }

    function polygonCentroid(poly) {
        const ring = poly[0];
        let lon = 0;
        let lat = 0;
        for (let i = 0; i < ring.length; i++) {
            lon += ring[i][0];
            lat += ring[i][1];
        }
        return [lon / ring.length, lat / ring.length];
    }

    function isAlaskaPolygon(poly) {
        const [lon, lat] = polygonCentroid(poly);
        // Alaska sits far north/west
        return lat > 50 && lon < -129;
    }

    function isHawaiiPolygon(poly) {
        const [lon, lat] = polygonCentroid(poly);
        return lat > 18 && lat < 24 && lon < -154 && lon > -162;
    }

    function featuresForMap(features) {
        const out = [];
        features.forEach((feature) => {
            const id = String(feature.id).padStart(3, "0");
            if (id !== "840" || feature.geometry.type !== "MultiPolygon") {
                out.push(feature);
                return;
            }

            const mainland = [];
            const excluded = [];
            feature.geometry.coordinates.forEach((poly) => {
                (isAlaskaPolygon(poly) || isHawaiiPolygon(poly) ? excluded : mainland).push(poly);
            });

            if (mainland.length) {
                out.push({
                    ...feature,
                    id: 840,
                    geometry: { type: "MultiPolygon", coordinates: mainland }
                });
            }
            if (excluded.length) {
                out.push({
                    ...feature,
                    id: "840-excluded",
                    geometry: { type: "MultiPolygon", coordinates: excluded }
                });
            }
        });
        return out;
    }

    const modal = document.getElementById("placeModal");
    const modalName = document.getElementById("placeModalName");
    const modalTagline = document.getElementById("placeModalTagline");
    const modalStory = document.getElementById("placeModalStory");
    const modalPhotos = document.getElementById("placeModalPhotos");
    const modalClose = document.getElementById("placeModalClose");
    const modalBackdrop = document.getElementById("placeModalBackdrop");

    function openPlace(place) {
        const name = place.name || markerLabel(place);
        modalName.textContent = name;
        const tagline = (place.tagline || "").trim();
        modalTagline.textContent = tagline;
        modalTagline.hidden = !tagline;
        const story = place.story || "";
        modalStory.textContent = story;
        modalStory.hidden = !story.trim();
        modalPhotos.innerHTML = "";

        const photos = place.photos || [];
        const isGallery = place.gallery === true || photos.length >= 8;
        modal.classList.toggle("has-gallery", isGallery);

        if (photos.length) {
            photos.forEach((photo) => {
                const src = typeof photo === "string" ? photo : photo.src;
                const tile = document.createElement("div");
                tile.className = "place-modal-photo";
                const img = document.createElement("img");
                img.src = src;
                img.alt = place.name || place.place || name;
                img.loading = "lazy";
                img.draggable = false;
                if (typeof photo === "object" && photo.position) {
                    img.style.objectPosition = photo.position;
                }
                tile.appendChild(img);
                modalPhotos.appendChild(tile);
            });
        } else {
            for (let i = 0; i < 2; i++) {
                const slot = document.createElement("div");
                slot.className = "photo-slot";
                slot.textContent = "Photo TBD";
                modalPhotos.appendChild(slot);
            }
        }

        modal.hidden = false;
        document.body.style.overflow = "hidden";
    }

    function closePlace() {
        modal.hidden = true;
        modal.classList.remove("has-gallery");
        document.body.style.overflow = "";
    }

    modalClose.addEventListener("click", closePlace);
    modalBackdrop.addEventListener("click", closePlace);
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !modal.hidden) closePlace();
    });

    async function drawMap() {
        const width = 1200;
        const height = 620;
        const wrap = document.getElementById("mapWrap");
        const tooltip = document.getElementById("mapTooltip");

        const svg = d3.select("#worldMap")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
        const countryFeatures = topojson.feature(world, world.objects.countries);
        const land = topojson.feature(world, world.objects.land);

        const projection = d3.geoNaturalEarth1()
            .fitExtent([[12, 4], [width - 12, height - 8]], land);

        const path = d3.geoPath(projection);

        const isNarrow = window.matchMedia("(max-width: 700px)").matches;
        const markerR = isNarrow ? 8 : 5.5;
        const hitR = isNarrow ? 22 : 14;

        svg.append("path")
            .datum({ type: "Sphere" })
            .attr("class", "map-ocean")
            .attr("d", path);

        svg.append("path")
            .datum(land)
            .attr("class", "map-land")
            .attr("d", path);

        svg.append("g")
            .attr("class", "map-countries")
            .selectAll("path")
            .data(featuresForMap(countryFeatures.features))
            .join("path")
            .attr("d", path)
            .attr("class", (d) => {
                const id = String(d.id).padStart(3, "0");
                return visitedIds.has(id) ? "map-country visited" : "map-country";
            })
            .attr("data-id", (d) => String(d.id));

        function showTooltip(event, place) {
            tooltip.hidden = false;
            tooltip.textContent = markerLabel(place);
            const rect = wrap.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            tooltip.style.left = `${x}px`;
            tooltip.style.top = `${y}px`;
        }

        function hideTooltip() {
            tooltip.hidden = true;
        }

        const markerLayer = svg.append("g").attr("class", "map-markers");

        // Draw special (clickable) markers last so they sit on top
        [...markers].sort((a, b) => Number(!!a.special) - Number(!!b.special)).forEach((place) => {
            const point = projection(place.coords);
            if (!point) return;
            const [x, y] = point;

            const g = markerLayer.append("g")
                .attr("class", place.special ? "map-marker special" : "map-marker")
                .attr("transform", `translate(${x},${y})`)
                .style("cursor", place.special ? "pointer" : "default");

            g.append("circle")
                .attr("r", markerR)
                .attr("class", "map-marker-dot");

            g.append("circle")
                .attr("r", hitR)
                .attr("class", "map-marker-hit")
                .on("mouseenter", (event) => showTooltip(event, place))
                .on("mousemove", (event) => showTooltip(event, place))
                .on("mouseleave", hideTooltip)
                .on("click", (event) => {
                    event.stopPropagation();
                    if (place.special) openPlace(place);
                });
        });
    }

    if (window.matchMedia("(max-width: 700px)").matches) {
        // Map hidden on mobile — skip loading atlas data
    } else {
        drawMap().catch((err) => {
            console.error(err);
            document.getElementById("mapWrap").innerHTML =
                "<p class=\"map-fallback\">Map couldn’t load right now. Please refresh.</p>";
        });
    }
</script>

</body>
</html>
